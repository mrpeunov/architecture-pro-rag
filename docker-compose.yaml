version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/data

  redis:
    image: redis:6.2
    volumes:
      - redis_data:/var/lib/redis/data
    ports:
      - "6379:6379"

volumes:
  chroma_data:
  redis_data: